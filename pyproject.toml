[project]
name = "shot-bot"
version = "0.1.0"
description = "Research-only, conservative short-term equity strategy components"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
research = [
  "yfinance>=0.2.54",
  "lightgbm>=4.0",
  "scikit-learn>=1.4",
]
shorts = [
  "Pillow>=10.0",
  "edge-tts>=7.0",
  "imageio-ffmpeg>=0.5",
]
youtube-upload = [
  "google-api-python-client>=2.0",
  "google-auth-oauthlib>=1.2",
]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
